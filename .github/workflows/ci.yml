name: CI

# Commits land straight on master here (see CLAUDE.md), so CI has to run on push too —
# a PR-only trigger would almost never fire.
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No lint step yet: `biome check` currently reports 108 errors on the existing code,
      # so wiring it in would make CI red from day one. Clean the codebase first, then add it.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
